# Canary Deployment. Same image as v1; Istio routes on version=v2.
# The Service and ServiceAccount reside in orders-v1.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-v2
  namespace: ecommerce
  labels:
    app: orders
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders
      version: v2
  template:
    metadata:
      labels:
        app: orders
        version: v2
    spec:
      serviceAccountName: orders
      containers:
        - name: orders
          image: 536697239284.dkr.ecr.us-east-1.amazonaws.com/istio-meshguard/orders:936dede
          env:
            - name: INVENTORY_ADDR
              value: inventory:50051
            - name: PAYMENTS_ADDR
              value: payments:50052
            - name: NOTIFICATIONS_ADDR
              value: notifications:50053
            - name: ORDERS_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['version']
          ports:
            - name: grpc
              containerPort: 50050
          readinessProbe:
            tcpSocket:
              port: 50050
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 50050
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
