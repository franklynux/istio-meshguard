apiVersion: v1
kind: ServiceAccount
metadata:
  name: inventory
  namespace: ecommerce
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: ecommerce
  labels:
    app: inventory
spec:
  selector:
    app: inventory
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
      appProtocol: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: ecommerce
  labels:
    app: inventory
    version: v1
spec:
  # In-memory stock: more than one replica would give each pod its own stock map.
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
        version: v1
    spec:
      serviceAccountName: inventory
      containers:
        - name: inventory
          image: 536697239284.dkr.ecr.us-east-1.amazonaws.com/istio-meshguard/inventory:1b1cf08
          ports:
            - name: grpc
              containerPort: 50051
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
