apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: orders
  namespace: ecommerce
spec:
  hosts:
    - "*"
  gateways:
    - meshguard-gateway
  http:
    - route:
        - destination:
            host: orders
            subset: v1
            port:
              number: 50050
          weight: 90
        - destination:
            host: orders
            subset: v2
            port:
              number: 50050
          weight: 10
