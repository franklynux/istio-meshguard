# Carries the app=payments label so the payments Service sends it traffic, passes
# readiness (no probe), and then fails every call because nothing listens on 50052.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-broken
  namespace: ecommerce
  labels:
    app: payments
    version: broken
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
      version: broken
  template:
    metadata:
      labels:
        app: payments
        version: broken
    spec:
      serviceAccountName: payments
      containers:
        - name: broken
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
