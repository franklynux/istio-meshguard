name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [inventory, orders]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: services/${{ matrix.service }}

  test-payments:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/payments/requirements*.txt
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check .
      - run: pytest

  test-notifications:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notifications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/notifications/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npm test

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@latest
      - name: Validate Kubernetes and Istio manifests
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            k8s istio chaos

  build-images:
    runs-on: ubuntu-latest
    needs: [test-go, test-payments, test-notifications]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: orders
            context: services/orders
            file: services/orders/Dockerfile
          - service: inventory
            context: services/inventory
            file: services/inventory/Dockerfile
          - service: payments
            context: services/payments
            file: services/payments/Dockerfile
          # notifications needs proto/ from the repo root, so it builds from there.
          - service: notifications
            context: .
            file: services/notifications/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
