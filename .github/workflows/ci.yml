name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [inventory, orders]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: services/${{ matrix.service }}

  test-payments:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/payments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/payments/requirements*.txt
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check .
      - run: pytest

  test-notifications:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notifications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/notifications/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npm test

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@latest
      - name: Validate Kubernetes and Istio manifests
        run: |
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            k8s istio chaos

  build-push:
    runs-on: ubuntu-latest
    needs: [test-go, test-payments, test-notifications, validate-manifests]
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.ECR_PUSH_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: orders
            context: services/orders
            file: services/orders/Dockerfile
          - service: inventory
            context: services/inventory
            file: services/inventory/Dockerfile
          - service: payments
            context: services/payments
            file: services/payments/Dockerfile
          # notifications needs proto/ from the repo root, so it builds from there.
          - service: notifications
            context: .
            file: services/notifications/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC, no stored keys)
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        if: env.PUSH == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: tag
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Check whether this tag already exists
        id: exists
        if: env.PUSH == 'true'
        run: |
          if aws ecr describe-images \
              --repository-name "istio-meshguard/${{ matrix.service }}" \
              --image-ids "imageTag=${{ steps.tag.outputs.sha }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.tag.outputs.sha }} already exists; skipping push (tags are immutable)."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push when enabled)
        if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.PUSH == 'true' && format('{0}/istio-meshguard/{1}:{2}', steps.ecr.outputs.registry, matrix.service, steps.tag.outputs.sha) || format('{0}:ci', matrix.service) }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
