syntax = "proto3";

package notifications;

option go_package = "github.com/franklynux/istio-meshguard/services/orders/pb/notifications";

// Notifications records order-confirmation messages (no real email is sent).
service Notifications {
  rpc SendConfirmation(SendConfirmationRequest) returns (SendConfirmationResponse);
}

message SendConfirmationRequest {
  string order_id = 1;
  string email = 2;
}

message SendConfirmationResponse {
  bool sent = 1;
}
